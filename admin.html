<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Unggah & Terbitkan Materi</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #1e293b;
    }
    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .file-box {
      border: 2px dashed #94a3b8;
      padding: 15px;
      border-radius: 8px;
      background: #f8fafc;
      margin-top: 8px;
    }
    .btn-simpan {
      background-color: #16a34a;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 1.05rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      margin-top: 15px;
    }
    .btn-simpan:hover {
      background-color: #15803d;
    }
    .status-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-weight: bold;
      white-space: pre-line;
    }
    .success { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .info { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h2>Pusat Unggah & Terbitkan Materi</h2>
      <p>Baku, Praktis, & Langsung Tuntas Sampai ke Jemaat</p>
    </header>

    <!-- Kunci Token GitHub Aman -->
    <div class="admin-card">
      <div class="form-group">
        <label>🔑 Kunci Token GitHub (Hanya Perlu Diisi Sekali):</label>
        <input type="password" id="gh-token" class="form-control" placeholder="Tempel Token GitHub di sini..." onchange="simpanToken()">
        <small id="token-status-text" style="color:#64748b;">*Token akan tersimpan aman di browser laptop Anda.</small>
      </div>
      <button onclick="pilihFolderMiniWeb()" id="btn-folder" style="padding:10px; width:100%; cursor:pointer; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:6px; font-weight:bold;">
        📁 Hubungkan Folder mini-web Laptop
      </button>
      <small id="lbl-folder-status" style="color:#ef4444; display:block; margin-top:6px; text-align:center;">
        *Belum terhubung ke folder mini-web
      </small>
    </div>

    <!-- Interface Unggah -->
    <div class="admin-card">
      <div class="form-group">
        <label>Pilih Minggu & Hari Target:</label>
        <div style="display: flex; gap: 10px;">
          <select id="select-minggu" class="form-control">
            <!-- Pilihan Minggu 1 - 12 -->
          </select>
          <select id="select-hari" class="form-control">
            <option value="Garis_Besar">Garis Besar</option>
            <option value="Senin">Senin</option>
            <option value="Selasa">Selasa</option>
            <option value="Rabu">Rabu</option>
            <option value="Kamis">Kamis</option>
            <option value="Jumat">Jumat</option>
            <option value="Sabtu">Sabtu</option>
          </select>
        </div>
      </div>

      <hr style="border:0; border-top:1px solid #e2e8f0; margin:20px 0;">

      <!-- Unggah Teks -->
      <div class="form-group file-box">
        <label id="lbl-teks">Silakan unggah file teks untuk minggu ke-1 hari Garis_Besar:</label>
        <input type="file" id="file-teks" accept=".html,.txt" class="form-control">
        <small>Target nama file: <b id="nama-target-teks">T_01_Garis_Besar.html</b></small>
      </div>

      <!-- Unggah Suara -->
      <div class="form-group file-box">
        <label id="lbl-suara">Silakan unggah file suara untuk minggu ke-1 hari Garis_Besar:</label>
        <input type="file" id="file-suara" accept=".mp3,.wav" class="form-control">
        <small>Target nama file: <b id="nama-target-suara">S_01_Garis_Besar.mp3</b></small>
      </div>

      <!-- Unggah Video -->
      <div class="form-group file-box">
        <label id="lbl-video">Silakan unggah file video untuk minggu ke-1 hari Garis_Besar:</label>
        <input type="file" id="file-video" accept=".mp4,.webm" class="form-control">
        <small>Target nama file: <b id="nama-target-video">V_01_Garis_Besar.mp4</b></small>
      </div>

      <button onclick="prosesSimpanDanTerbit()" class="btn-simpan">🚀 💾 Simpan & Terbitkan ke Jemaat</button>
      
      <div id="status-notif" class="status-msg"></div>
    </div>
  </div>

  <script>
    const REPO_OWNER = 'kobadri';
    const REPO_NAME = 'penyegaran-pagi';
    let folderHandle = null;

    document.addEventListener('DOMContentLoaded', () => {
      const savedToken = localStorage.getItem('gh_token_penyegaran');
      if (savedToken) {
        document.getElementById('gh-token').value = savedToken;
        document.getElementById('token-status-text').innerText = '✓ Token tersimpan secara lokal di browser Anda.';
        document.getElementById('token-status-text').style.color = '#16a34a';
      }
    });

    function simpanToken() {
      const val = document.getElementById('gh-token').value.trim();
      if (val) {
        localStorage.setItem('gh_token_penyegaran', val);
        document.getElementById('token-status-text').innerText = '✓ Token tersimpan secara lokal di browser Anda.';
        document.getElementById('token-status-text').style.color = '#16a34a';
      }
    }

    const selMinggu = document.getElementById('select-minggu');
    for (let i = 1; i <= 12; i++) {
      let opt = document.createElement('option');
      opt.value = i;
      opt.innerText = `Minggu ke-${i}`;
      selMinggu.appendChild(opt);
    }

    function updateLabels() {
      const m = String(selMinggu.value).padStart(2, '0');
      const h = document.getElementById('select-hari').value;

      document.getElementById('lbl-teks').innerText = `Silakan unggah file teks untuk minggu ke-${selMinggu.value} hari ${h}:`;
      document.getElementById('lbl-suara').innerText = `Silakan unggah file suara untuk minggu ke-${selMinggu.value} hari ${h}:`;
      document.getElementById('lbl-video').innerText = `Silakan unggah file video untuk minggu ke-${selMinggu.value} hari ${h}:`;

      document.getElementById('nama-target-teks').innerText = `T_${m}_${h}.html`;
      document.getElementById('nama-target-suara').innerText = `S_${m}_${h}.mp3`;
      document.getElementById('nama-target-video').innerText = `V_${m}_${h}.mp4`;
    }

    selMinggu.addEventListener('change', updateLabels);
    document.getElementById('select-hari').addEventListener('change', updateLabels);
    updateLabels();

    async function pilihFolderMiniWeb() {
      try {
        folderHandle = await window.showDirectoryPicker();
        document.getElementById('lbl-folder-status').innerText = `✓ Terhubung ke folder: ${folderHandle.name}`;
        document.getElementById('lbl-folder-status').style.color = "#16a34a";
      } catch (err) {
        alert("Akses folder dibatalkan.");
      }
    }

    async function prosesSimpanDanTerbit() {
      const token = localStorage.getItem('gh_token_penyegaran') || document.getElementById('gh-token').value.trim();
      if (!token) {
        alert("Harap isi Kunci Token GitHub terlebih dahulu!");
        return;
      }

      if (!folderHandle) {
        alert("Harap klik 'Hubungkan Folder mini-web Laptop' terlebih dahulu!");
        return;
      }

      const notif = document.getElementById('status-notif');
      notif.style.display = "block";
      notif.className = "status-msg info";
      notif.innerText = "⏳ Sedang menyimpan ke laptop & menerbitkan ke GitHub...";

      const m = String(selMinggu.value).padStart(2, '0');
      const h = document.getElementById('select-hari').value;

      let fileTeks = document.getElementById('file-teks').files[0];
      let fileSuara = document.getElementById('file-suara').files[0];
      let fileVideo = document.getElementById('file-video').files[0];

      let totalSelesai = 0;

      try {
        if (fileTeks) {
          const namaTarget = `T_${m}_${h}.html`;
          await tulisLokal(namaTarget, fileTeks);
          await uploadGitHub(namaTarget, fileTeks, token);
          totalSelesai++;
        }
        if (fileSuara) {
          const namaTarget = `S_${m}_${h}.mp3`;
          await tulisLokal(namaTarget, fileSuara);
          await uploadGitHub(namaTarget, fileSuara, token);
          totalSelesai++;
        }
        if (fileVideo) {
          const namaTarget = `V_${m}_${h}.mp4`;
          await tulisLokal(namaTarget, fileVideo);
          await uploadGitHub(namaTarget, fileVideo, token);
          totalSelesai++;
        }

        if (totalSelesai > 0) {
          notif.className = "status-msg success";
          notif.innerText = `🎉 Berhasil! ${totalSelesai} file telah tersimpan di laptop DAN langsung terbit ke Jemaat secara tuntas!`;
        } else {
          notif.className = "status-msg error";
          notif.innerText = "Pilih minimal satu file untuk diunggah.";
        }
      } catch (e) {
        notif.className = "status-msg error";
        notif.innerText = "Gagal menerbitkan: " + e.message;
      }
    }

    async function tulisLokal(namaTarget, fileData) {
      const fileHandle = await folderHandle.getFileHandle(namaTarget, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(fileData);
      await writable.close();
    }

    async function uploadGitHub(path, file, token) {
      const arrayBuffer = await file.arrayBuffer();
      const base64Content = btoa(new Uint8Array(arrayBuffer).reduce((data, byte) => data + String.fromCharCode(byte), ''));
      
      const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
      
      let sha = null;
      try {
        const getRes = await fetch(url, {
          headers: { 'Authorization': `token ${token}` }
        });
        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
        }
      } catch (e) {}

      const bodyData = {
        message: `Update materi ${path} via Admin Interface`,
        content: base64Content
      };
      if (sha) bodyData.sha = sha;

      const putRes = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(bodyData)
      });

      if (!putRes.ok) {
        const err = await putRes.json();
        throw new Error(err.message || 'Gagal koneksi ke GitHub');
      }
    }
  </script>
</body>
</html>
