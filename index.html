<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penyegaran Pagi - FKKP</title>
    <meta name="theme-color" content="#1e5138">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png">
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .mobile-container {
            width: 100%; max-width: 440px; min-height: calc(100vh - 30px);
            background: #ffffff; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden; display: flex; flex-direction: column;
        }
        .header { background-color: #1e5138; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 18px; }
        .sub-header { text-align: center; padding: 15px 10px; font-size: 16px; font-weight: bold; color: #333; border-bottom: 1px solid #eee; background: #f9f9f9; }
        .date-box { text-align: center; padding: 12px; margin: 15px 20px; background: #f8f9fa; border: 1px solid #e5e7eb; border-radius: 8px; }
        .date-box .date { font-weight: bold; color: #1e5138; font-size: 15px; }
        .date-box .desc { font-size: 12px; color: #666; margin-top: 3px; }
        .pesan-luar { display: none; margin: 10px 20px; padding: 14px; background: #fdf3e4; border: 1px solid #f0d9b5; border-radius: 8px; color: #7a5a1e; font-size: 13px; line-height: 1.5; text-align: center; }
        .menu-list { padding: 10px 20px; display: flex; flex-direction: column; gap: 10px; }
        .menu-btn, .submenu-btn, .modal-tutup, .btn-media-sub {
            width: 60%; margin-left: auto; margin-right: auto; padding: 14px 20px;
            font-size: 1.05rem; font-weight: bold; font-family: inherit;
            display: flex; justify-content: space-between; align-items: center;
            color: white; text-decoration: none; border: none; border-radius: 8px;
            cursor: pointer; text-align: center; transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .menu-btn > span:first-child, .submenu-btn > span:first-child { flex-grow: 1; text-align: center; }
        .menu-btn:active, .submenu-btn:active { transform: scale(0.98); }
        .menu-btn { background-color: #1e5138; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .menu-btn:hover { background-color: #143726; }
        .btn-media-sub { background-color: #2e7d32; justify-content: center; }
        .btn-media-sub:hover { background-color: #1e5138; }
        .menu-btn-danger { background-color: #991b1b; margin-top: 5px; }
        .menu-btn-danger:hover { background-color: #7f1d1d; }
        /* PERBAIKAN 2026-11-09: warna tombol sesuai tampilan baru
           (sampling dari desain): Pekan Lalu merah #b91c1c,
           Hari Ini hijau #2e7d32, selebihnya hijau tua #1e5138. */
        .menu-btn-lalu { background-color: #b91c1c; }
        .menu-btn-lalu:hover { background-color: #7f1d1d; }
        .menu-btn-sukses { background-color: #2e7d32; }
        .menu-btn-sukses:hover { background-color: #1e5138; }
        .submenu-container { display: none; flex-direction: column; gap: 6px; padding-left: 10px; margin-bottom: 5px; }
        .submenu-btn { background-color: #2d7a54; border-radius: 6px; }
        .submenu-btn:hover { background-color: #1e5138; }
        /* BARU 2026-11-09: isi dropdown Pekan Lalu berwarna MERAH MUDA,
           serasi dengan tombol Pekan Lalu yang merah. */
        .submenu-btn-lalu { background-color: #e05252; border-radius: 6px; }
        .submenu-btn-lalu:hover { background-color: #991b1b; }
        .footer { text-align: center; padding: 12px; font-size: 12px; color: #777; border-top: 1px solid #eee; background: #f9f9f9; margin-top: auto; }
        #mediaModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: 200; justify-content: center; align-items: center; padding: 10px; }
        .modal-content { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; text-align: center; }
        .modal-tutup { background: #1e5138; margin-top: 15px; justify-content: center; width: 100%; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="header">Penyegaran Pagi - FKKP</div>
        <div class="sub-header" id="pp-sub-judul">Kaum Beriman (1)</div>
        <div class="date-box">
            <div class="date" id="pp-tanggal">Menyiapkan tanggal...</div>
            <div class="desc" id="pp-deskripsi">&nbsp;</div>
        </div>
        <div class="pesan-luar" id="pp-pesan-luar">Buku penyegaran pagi <b>Kaum Beriman (1)</b> berlaku 4 Oktober - 26 Desember 2026.</div>
        <script>
        /* ============================================================
           PERBAIKAN 2026-11-07: TANGGAL LANGSUNG TAMPIL
           Sebelumnya tanggal hanya terisi oleh app.js; bila app.js
           tertunda/blokir (mis. mode preview), kotak tanggal diam
           dengan teks "Menyiapkan tanggal...". Script kecil ini
           mandiri (tanpa pp-konfigurasi.js / app.js) dan mengisi
           tanggal seketika. Bila app.js ternyata berjalan, hasilnya
           ditulis ulang dengan nilai yang sama (idempoten).
           ============================================================ */
        (function () {
            "use strict";
            var HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            var BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni",
                         "Juli", "Agustus", "September", "Oktober", "Nopember", "Desember"];
            var SATU_HARI = 24 * 60 * 60 * 1000;
            var MS_MULAI = Date.UTC(2026, 9, 4);      /* 4 Oktober 2026 */
            var MS_SELESAI = Date.UTC(2026, 11, 26);  /* 26 Desember 2026 */
            var JUMLAH_PEKAN = 12;

            function tanggalWIB() {
                var y = 0, m = 0, d = 0, ok = false;
                try {
                    var fmt = new Intl.DateTimeFormat("en-GB", {
                        timeZone: "Asia/Jakarta",
                        year: "numeric", month: "2-digit", day: "2-digit"
                    });
                    if (fmt.formatToParts) {
                        var bag = fmt.formatToParts(new Date()), i;
                        for (i = 0; i < bag.length; i++) {
                            if (bag[i].type === "year")  y = parseInt(bag[i].value, 10);
                            if (bag[i].type === "month") m = parseInt(bag[i].value, 10);
                            if (bag[i].type === "day")   d = parseInt(bag[i].value, 10);
                        }
                        ok = (y > 1970 && m >= 1 && m <= 12 && d >= 1 && d <= 31);
                    }
                } catch (e) { ok = false; }
                if (!ok) {
                    var wib = new Date(Date.now() + (7 * 60 + new Date().getTimezoneOffset()) * 60000);
                    y = wib.getFullYear(); m = wib.getMonth() + 1; d = wib.getDate();
                }
                var ms = Date.UTC(y, m - 1, d);
                return { hari: new Date(ms).getUTCDay(), ms: ms, y: y };
            }

            try {
                var t = tanggalWIB();
                var tgl = new Date(t.ms);
                var selisih = Math.round((t.ms - MS_MULAI) / SATU_HARI);
                var dalam = (selisih >= 0 && t.ms <= MS_SELESAI);
                var pekan = dalam ? Math.floor(selisih / 7) + 1 : 0;
                var mulaiPekan = t.ms - t.hari * SATU_HARI;
                var akhirPekan = mulaiPekan + 6 * SATU_HARI;
                var a = new Date(mulaiPekan), b = new Date(akhirPekan);

                var elTgl = document.getElementById("pp-tanggal");
                if (elTgl) elTgl.textContent = HARI[t.hari] + ", " + tgl.getUTCDate() + " " + BULAN[tgl.getUTCMonth()] + " " + t.y;

                var elDesc = document.getElementById("pp-deskripsi");
                if (elDesc) {
                    if (dalam) {
                        var rentang = (a.getUTCMonth() === b.getUTCMonth())
                            ? a.getUTCDate() + " - " + b.getUTCDate() + " " + BULAN[b.getUTCMonth()] + " " + b.getUTCFullYear()
                            : (a.getUTCDate() + " " + BULAN[a.getUTCMonth()]) + " - " + (b.getUTCDate() + " " + BULAN[b.getUTCMonth()]) + " " + b.getUTCFullYear();
                        elDesc.textContent = "Pekan " + pekan + " dari " + JUMLAH_PEKAN + " \u2022 " + rentang;
                    } else {
                        elDesc.textContent = "Periode buku: 4 Oktober - 26 Desember " + new Date(MS_MULAI).getUTCFullYear();
                    }
                }

                var pesan = document.getElementById("pp-pesan-luar");
                if (pesan) pesan.style.display = dalam ? "none" : "block";
            } catch (e) { /* biarkan teks bawaan bila kondisi tak terduga */ }
        })();
        </script>
        <div class="menu-list">
            <!-- PERBAIKAN 2026-11-09: Pekan Lalu kini tombol dropdown
                 merah, PERSIS sama perilakunya dengan "Pekan Ini".
                 Isi submenu dibangun otomatis oleh app.js (render()):
                 bila pekan ini Pekan_06 maka menu ini berisi Pekan_05
                 (data/teks/t_05_*_01.html). Sebelumnya tombol ini
                 mengarah ke pekan-lalu.html yang tidak ada (404). -->
            <a href="javascript:void(0);" id="baris-pekan-lalu" onclick="toggleSubmenuLalu();" class="menu-btn menu-btn-lalu"><span>Pekan Lalu</span><span id="panah-pekan-lalu">&#9660;</span></a>
            <div id="pekanLaluSubmenu" class="submenu-container"></div>
            <a href="#" id="btn-hari-ini" class="menu-btn menu-btn-sukses"><span>Hari Ini</span><span>&rsaquo;</span></a>
            <a href="javascript:void(0);" id="baris-pekan-ini" onclick="toggleSubmenu();" class="menu-btn"><span>Pekan Ini</span><span id="panah-pekan-ini">&#9660;</span></a>
            <div id="pekanSubmenu" class="submenu-container"></div>
            <button class="menu-btn" onclick="toggleMediaMenu();"><span>&#127916; Media</span><span id="media-arrow">&#9660;</span></button>
            <div id="media-submenu" style="display:none; flex-direction:column; gap:6px; margin-bottom:10px;">
                <button class="btn-media-sub" onclick="playAudioPekanIni();">&#127925; Audio</button>
                <button class="btn-media-sub" onclick="playVideoPekanIni();">&#127916; Video</button>
            </div>
            <button class="menu-btn" id="btn-install" style="display:none;" onclick="instalAplikasi();"><span>&#128242; Install Aplikasi</span><span>&rsaquo;</span></button>
            <a href="#" onclick="exitApp(); return false;" class="menu-btn menu-btn-danger"><span>Keluar / Exit</span><span>&rsaquo;</span></a>
        </div>
        <div class="footer">Penyegaran Pagi - FKKP</div>
    </div>
    <div id="mediaModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modalBody"></div>
            <button class="modal-tutup" onclick="closeModalDirect()">Tutup</button>
        </div>
    </div>
    <script src="pp-konfigurasi.js?v=4"></script>
    <script src="app.js?v=6"></script>
    <script>
        /* ============================================================
           PERBAIKAN 2026-11-09 v2: JARING PENGAMAN SUBMENU
           ------------------------------------------------------------
           Masalah dilaporkan: tombol "Pekan Lalu" tidak merespon.
           Sebab: app.js versi LAMA masih terpasang di server sehingga
           submenu #pekanLaluSubmenu tidak pernah diisi (dropdown
           terbuka tetapi tingginya nol piksel - terkesan mati).
           Solusi: script mandiri di bawah mengisi submenu HANYA BILA
           MASIH KOSONG, sehingga:
           - app.js baru sudah jalan  -> submenu terisi -> dilewati.
           - app.js lama / gagal muat -> diisi di sini -> tombol tetap
             merespon (tautan langsung ke berkas bacaan).
           Isinya dihitung dinamis dari tanggal WIB: bila pekan ini
           Pekan_06 maka Pekan Lalu berisi t_05_*_01.html.
           ============================================================ */
        function ppPosisiCadangan() {
            var t = null, y = 0, m = 0, d = 0;
            try {
                var fmt = new Intl.DateTimeFormat("en-GB", {
                    timeZone: "Asia/Jakarta",
                    year: "numeric", month: "2-digit", day: "2-digit"
                });
                if (fmt.formatToParts) {
                    var bag = fmt.formatToParts(new Date()), i;
                    for (i = 0; i < bag.length; i++) {
                        if (bag[i].type === "year")  y = parseInt(bag[i].value, 10);
                        if (bag[i].type === "month") m = parseInt(bag[i].value, 10);
                        if (bag[i].type === "day")   d = parseInt(bag[i].value, 10);
                    }
                    t = Date.UTC(y, m - 1, d);
                }
            } catch (e) { t = null; }
            if (!t) {
                var w = new Date(Date.now() + (7 * 60 + new Date().getTimezoneOffset()) * 60000);
                t = Date.UTC(w.getFullYear(), w.getMonth(), w.getDate());
            }
            var MS_MULAI = Date.UTC(2026, 9, 4);      /* 4 Oktober 2026 */
            var MS_SELESAI = Date.UTC(2026, 11, 26);  /* 26 Desember 2026 */
            var selisih = Math.round((t - MS_MULAI) / 86400000);
            var dalam = (selisih >= 0 && t <= MS_SELESAI);
            return { dalam: dalam, pekan: dalam ? Math.floor(selisih / 7) + 1 : 0 };
        }

        var ppHariCadangan  = ["garis_besar", "senin", "selasa", "rabu", "kamis", "jumat", "sabtu"];
        var ppLabelCadangan = ["Garis Besar", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

        function ppIsiSubmenuCadangan(idKontainer, pekanTarget, pakaiMerah) {
            var kotak = document.getElementById(idKontainer);
            if (!kotak || kotak.children.length > 0) return; /* sudah diisi app.js */
            var posisi = ppPosisiCadangan();
            if (!posisi.dalam || pekanTarget < 1 || pekanTarget > 12) {
                var info = document.createElement("div");
                info.style.cssText = "font-size:12px;color:#666;padding:4px 6px;text-align:center;";
                info.textContent = (posisi.dalam && pekanTarget < 1)
                    ? "Buku ini baru dimulai (Pekan 1). Belum ada pekan sebelumnya."
                    : "Submenu bacaan aktif saat periode buku berjalan.";
                kotak.appendChild(info);
                return;
            }
            var nomor = (pekanTarget < 10 ? "0" : "") + pekanTarget;
            for (var i = 0; i < ppHariCadangan.length; i++) {
                var a = document.createElement("a");
                a.className = "submenu-btn" + (pakaiMerah ? " submenu-btn-lalu" : "");
                a.setAttribute("href", "data/teks/t_" + nomor + "_" + ppHariCadangan[i] + "_01.html");
                var kiri = document.createElement("span");
                kiri.textContent = ppLabelCadangan[i];
                var kanan = document.createElement("span");
                kanan.innerHTML = "&rsaquo;";
                a.appendChild(kiri);
                a.appendChild(kanan);
                kotak.appendChild(a);
            }
        }

        function toggleSubmenu() {
            var pos = ppPosisiCadangan();
            ppIsiSubmenuCadangan("pekanSubmenu", pos.pekan, false);
            var s = document.getElementById("pekanSubmenu");
            var a = document.getElementById("panah-pekan-ini");
            var t = (s.style.display === "flex");
            s.style.display = t ? "none" : "flex";
            if (a) a.textContent = t ? "\u25BC" : "\u25B2";
        }
        function toggleSubmenuLalu() {
            var pos = ppPosisiCadangan();
            ppIsiSubmenuCadangan("pekanLaluSubmenu", pos.pekan - 1, true);
            var s = document.getElementById("pekanLaluSubmenu");
            var a = document.getElementById("panah-pekan-lalu");
            var t = (s.style.display === "flex");
            s.style.display = t ? "none" : "flex";
            if (a) a.textContent = t ? "\u25BC" : "\u25B2";
        }
        function toggleMediaMenu() { var s = document.getElementById("media-submenu"); var a = document.getElementById("media-arrow"); var t = (s.style.display === "flex"); s.style.display = t ? "none" : "flex"; a.textContent = t ? "\u25BC" : "\u25B2"; }
        function exitApp() { try { window.close(); } catch (e) {} window.location.replace("about:blank"); }

        /* Isi sejak awal bila masih kosong (app.js lama/tidak ada) */
        ppIsiSubmenuCadangan("pekanLaluSubmenu", ppPosisiCadangan().pekan - 1, true);
        ppIsiSubmenuCadangan("pekanSubmenu", ppPosisiCadangan().pekan, false);
    </script>
    <script>
        /* PERBARUI 2026-11-08: pendaftaran service worker.
           Tanpa ini PWA tidak dapat di-install dan mode offline
           tidak pernah aktif (sw.js sebelumnya tidak pernah
           didaftarkan). */
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./sw.js").catch(function () {});
            });
        }
    </script>
</body>
</html>
